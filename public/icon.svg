<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Red Diamond Gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#800f1a"/>
    </linearGradient>

    <!-- Metallic Silver Text Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Stroke Silver Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Tilted Red Diamond Shield -->
  <g transform="translate(256, 230) rotate(-12)">
    <rect x="-165" y="-165" width="330" height="330" rx="60" fill="url(#redGrad)" filter="url(#dropShadow)" stroke="#f87171" stroke-width="4"/>
  </g>

  <!-- Foreground ARZ Metallic Monogram -->
  <g filter="url(#dropShadow)">
    <!-- ARZ Text -->
    <text x="256" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="url(#silverGrad)" stroke="url(#strokeGrad)" stroke-width="6" text-anchor="middle" letter-spacing="4">
      ARZ
    </text>

    <!-- Subtitle: CV ARZLAN ADYATAMA -->
    <rect x="76" y="325" width="360" height="42" rx="10" fill="#0f172a" opacity="0.9" stroke="url(#strokeGrad)" stroke-width="2"/>
    <text x="256" y="353" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="22" font-weight="900" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="2">
      CV ARZLAN ADYATAMA
    </text>
  </g>
</svg>
